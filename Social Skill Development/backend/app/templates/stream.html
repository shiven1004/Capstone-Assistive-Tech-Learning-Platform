<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas { 
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            border-radius: 8px;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        
        // Set canvas size
        canvas.width = 640;
        canvas.height = 480;
        
        // Function to handle MJPEG stream
        async function startStream() {
            try {
                statusDiv.textContent = '📡 Connecting to stream...';
                const response = await fetch('/api/video_feed');
                
                if (!response.ok) {
                    throw new Error('Stream response: ' + response.status);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let frameCount = 0;
                
                statusDiv.textContent = '✅ Stream active';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    // Find JPEG data boundaries
                    const startIdx = buffer.indexOf('\xFF\xD8');
                    const endIdx = buffer.indexOf('\xFF\xD9');
                    
                    if (startIdx !== -1 && endIdx !== -1) {
                        const jpegData = buffer.substring(startIdx, endIdx + 2);
                        buffer = buffer.substring(endIdx + 2);
                        
                        // Create blob and display
                        const binaryString = atob(jpegData.substring(2).split('').map(c => 
                            ('0' + c.charCodeAt(0).toString(16)).slice(-2)
                        ).join(''));
                        
                        const blob = new Blob([new Uint8Array(binaryString.split('').map(c => c.charCodeAt(0)))], 
                                            { type: 'image/jpeg' });
                        const url = URL.createObjectURL(blob);
                        const img = new Image();
                        
                        img.onload = () => {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            frameCount++;
                            statusDiv.textContent = `✅ Streaming (${frameCount} frames)`;
                            URL.revokeObjectURL(url);
                        };
                        
                        img.src = url;
                    }
                }
            } catch (err) {
                console.error('Stream error:', err);
                statusDiv.textContent = '❌ Stream error: ' + err.message;
                
                // Retry after delay
                setTimeout(startStream, 2000);
            }
        }
        
        // Alternative simpler approach: use img tag with polling
        function startSimpleStream() {
            statusDiv.textContent = '📡 Starting stream...';
            let frameNum = 0;
            
            function updateFrame() {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    frameNum++;
                    statusDiv.textContent = `✅ Live (${frameNum} frames)`;
                    setTimeout(updateFrame, 33); // ~30 FPS
                };
                img.onerror = () => {
                    statusDiv.textContent = '⏳ Reconnecting...';
                    setTimeout(updateFrame, 1000);
                };
                img.src = '/api/video_feed?t=' + Date.now();
            }
            
            updateFrame();
        }
        
        // Start with simple approach (works better for MJPEG)
        startSimpleStream();
    </script>
</body>
</html>
